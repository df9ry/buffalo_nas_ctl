services:
  buffalo-nas-ctl-proxy:
    image: alpine:latest
    container_name: buffalo-nas-ctl-proxy
    user: "buffalo-nas:buffalo-nas"
    command: >
      sh -c "
      apk add --no-cache systemd-journal-remote &&
      journalctl --follow --unit=buffalo-nas-ctl.service --output=short-full
      "
    restart: unless-stopped
    network_mode: host  # Ermöglicht Zugriff auf localhost des Hosts
    labels:
      - "dockmon.httpcheck.enabled=true"
      - "dockmon.httpcheck.url=http://localhost:8000/api/health"
      - "dockmon.httpcheck.interval=30"       # Prüfung alle 30 Sekunden
      - "dockmon.httpcheck.timeout=5"         # Timeout nach 5 Sekunden
      - "dockmon.httpcheck.expected_code=200" # Erwarteter HTTP-Status
